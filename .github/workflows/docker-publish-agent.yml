name: Publish Agent Docker Image

# 从上游 komari-agent 源码构建，推送到本账号 GHCR：
#   ghcr.io/yvdonghai/komari-agent:latest
# 之后可把 AGENT_REPO 改成你自己的 agent fork。

on:
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - ".github/workflows/docker-publish-agent.yml"
  workflow_dispatch:
    inputs:
      agent_ref:
        description: komari-agent git ref to build
        required: false
        default: "1.5.11"
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # 镜像名固定为自己的 agent，不跟面板仓库名耦合
  IMAGE_NAME: ${{ github.repository_owner }}/komari-agent
  AGENT_REPO: https://github.com/komari-monitor/komari-agent.git

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout panel repo (for agent/Dockerfile)
        uses: actions/checkout@v4

      - name: Resolve agent ref
        id: ref
        run: |
          REF="${{ github.event.inputs.agent_ref }}"
          if [ -z "$REF" ]; then
            REF="1.5.11"
          fi
          echo "agent_ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout agent source
        uses: actions/checkout@v4
        with:
          repository: komari-monitor/komari-agent
          ref: ${{ steps.ref.outputs.agent_ref }}
          path: agent-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent-src/go.mod

      - name: Build static binaries
        working-directory: agent-src
        env:
          GOOS: linux
          CGO_ENABLED: 0
        run: |
          VERSION="${{ steps.ref.outputs.agent_ref }}"
          LDFLAGS="-s -w -X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION}"

          echo "Building linux/amd64..."
          GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o ../komari-agent-linux-amd64 .

          echo "Building linux/arm64..."
          GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o ../komari-agent-linux-arm64 .

      - name: Prepare Docker context
        run: |
          cp agent/Dockerfile ./Dockerfile.agent
          ls -la komari-agent-linux-*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ref.outputs.agent_ref }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.agent
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
